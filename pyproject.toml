[project]
name = "smalt-mcp"
version = "1.3.4.dev0"
description = "MCP server wrapping the Smalt's storage surface (read/write/link/claim/search) for ParkviewLab's CoGrind project."
readme = "README.md"
requires-python = ">=3.13"
license = "MIT OR Apache-2.0"
license-files = ["LICENSE-MIT", "LICENSE-APACHE"]
authors = [{ name = "Gary Frattarola", email = "garyf@parkviewlab.ai" }]
dependencies = [
    "mcp[cli]>=1.27.0",
    "fastapi",
    "uvicorn[standard]",
    "starlette>=1.0.1",  # GHSA-86qp-5c8j-p5mr: Host-header validation (fixed 1.0.1)
    "pydantic",
    "python-frontmatter",
    "pyyaml",
    "lancedb>=0.30",
    "pyarrow",
    "fastembed",
    "numpy",
]

[project.scripts]
smalt-mcp = "smalt_mcp.__main__:main"

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "httpx",
    "asgi-lifespan>=2.1.0",
    "ruff",
    "ty",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/smalt_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: tests that exercise the running MCP server end-to-end",
]

[tool.ruff]
line-length = 110
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C4", "RUF"]
ignore = [
    "E501",  # line length handled by formatter
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011"]

[tool.ty.src]
include = ["src"]

[tool.ty.environment]
python-version = "3.13"
