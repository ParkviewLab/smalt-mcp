# smalt-mcp — MCP server wrapping the Smalt storage surface.
#
# Edit CHANGE-ME placeholders to fit your deployment. The default volume
# (named) keeps the Smalt under Docker's management; swap to the bind-mount
# section if you want to browse it from the host directly.

services:
  smalt-mcp:
    image: ghcr.io/parkviewlab/smalt-mcp:latest
    container_name: smalt-mcp
    restart: unless-stopped
    ports:
      - "35833:35833"
    environment:
      # Externally-reachable URL clients use (set in real deployments).
      # Default is fine for local dev.
      # PUBLIC_BASE_URL: "http://localhost:35833"

      # Read-only by default for shared deployments; flip to read_write only
      # if you trust every client that can reach this container.
      SMALT_SCOPE: "read_only"

      # Embedder defaults — see README for alternative providers.
      EMBEDDING_PROVIDER: "fastembed"
      EMBEDDING_MODEL: "BAAI/bge-small-en-v1.5"
      EMBEDDING_DIM: "384"

    # Pick one — named volume (default) or bind mount:
    volumes:
      - smalt-data:/data
      # - /CHANGE-ME/path/to/smalt:/data    # bind mount alternative

volumes:
  smalt-data:
